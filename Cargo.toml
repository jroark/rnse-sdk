# The SDK's tests: its programs built with build.sh and run on the
# emulator (tests/emulated.rs).  No Rust code of its own; the SDK is C.
# The emulator, the `rnse` crate, comes from git, pinned to a commit of
# https://github.com/jroark/rnse (Cargo.lock pins it too).
[package]
name = "rnse-sdk"
version = "0.1.0"
edition = "2021"
description = "Tests of the RNS-E SDK's programs on the rnse emulator"
license = "MIT"
publish = false

[dev-dependencies]
rnse = { git = "https://github.com/jroark/rnse", rev = "0e3a2d4ce5941161e17ff4816126281fbcf80088" }

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
