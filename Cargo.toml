# The SDK's tests: its programs built with build.sh and run on the
# emulator (tests/emulated.rs).  No Rust code of its own; the SDK is C.
# The emulator, the `rnse` crate, comes from git, pinned to a commit of
# https://github.com/jroark/rnse (Cargo.lock pins it too).
[package]
name = "rnse-sdk"
version = "0.1.0"
edition = "2021"
description = "Tests of the RNS-E SDK's programs on the rnse emulator"
license = "MIT"
publish = false

[dev-dependencies]
rnse = { git = "https://github.com/jroark/rnse", rev = "b4446e046df0f11cefa7ebd1e8392b268abaf01c" }

# The emulator's end of tools/bench193.py.
[[example]]
name = "mon193emu"
path = "tools/mon193emu.rs"

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
